[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostline-cyberpunk-mcp"
version = "0.1.0"
description = "Standalone Cyberpunk 2077 gameplay MCP server"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.scripts]
cyberpunk-mcp = "cyberpunk_mcp.cli:main"

[project.optional-dependencies]
test = ["numpy>=2,<3"]

[tool.setuptools]
packages = ["cyberpunk_mcp"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
cyberpunk_mcp = ["cet/*.lua"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F"]
